# Operations for User Table
mutation CreateUser($data: User_Data!) @auth(level: USER) {
  user_insert(data: $data)
}

mutation UpdateUser($data: User_Data!) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: $data)
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: { id_expr: "auth.uid" })
}

query GetUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    email displayName createdAt
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Public list of users is allowed for community discoverability.") {
  users {
    displayName avatarUrl
  }
}

# Operations for Author Table
mutation CreateAuthor($data: Author_Data!) @auth(level: USER) {
  author_insert(data: $data)
}

mutation UpdateAuthor($id: UUID!, $data: Author_Data!) @auth(level: USER) {
  author_update(id: $id, data: $data)
}

mutation DeleteAuthor($id: UUID!) @auth(level: USER) {
  author_delete(id: $id)
}

query GetAuthor($id: UUID!) @auth(level: PUBLIC, insecureReason: "Author profiles are public.") {
  author(id: $id) {
    name bio socialMediaLinks
  }
}

query ListAuthors @auth(level: PUBLIC, insecureReason: "Public list of authors is allowed.") {
  authors {
    name
  }
}

