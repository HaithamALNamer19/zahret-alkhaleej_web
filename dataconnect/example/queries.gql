# Operations for Bookmark Table
mutation CreateBookmark($data: Bookmark_Data!) @auth(level: USER) {
  bookmark_insert(data: $data)
}

mutation DeleteBookmark($id: UUID!) @auth(level: USER) {
  bookmark_delete(id: $id)
}

query GetBookmark($id: UUID!) @auth(level: USER) {
  bookmark(id: $id) {
    createdAt article { title }
  }
}

query ListMyBookmarks @auth(level: USER) {
  bookmarks(where: { userId: { eq_expr: "auth.uid" } }) {
    article { title }
    createdAt
  }
}